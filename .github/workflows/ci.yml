# Имя вашего пайплайна, которое будет крупно отображаться во вкладке Actions на GitHub
name: GitHub Actions CI with Full Stack Validation

# Раздел ON определяет триггеры — события, при которых конвейер автоматически запускается
on:
  # Запускать конвейер каждый раз, когда происходит push (отправка) кода в репозиторий
  push:
    # Отслеживать изменения конкретно в главной ветке "main"
    branches: [ "main" ]
  # Запускать конвейер, если кто-то создал Pull Request (предложение объединить код)
  pull_request:
    # Проверять Pull Request, если его хотят влить в ветку "main"
    branches: [ "main" ]

# Раздел JOBS — это список больших независимых стадий (заданий) нашего конвейера
jobs:

  # --- СТАДИЯ 1 (ВЫПОЛНЯЕТСЯ ПАРАЛЛЕЛЬНО): ПРОВЕРКА КОДА БЭКЕНДА ---
  validate-backend:
    # Красивое имя задания, которое будет видно в графическом интерфейсе GitHub
    name: 🧠 Проверка Бэкенда
    # RUNS-ON указывает, какую операционную систему выделить в облаке под это задание
    runs-on: ubuntu-latest
    
    # STEPS — это список последовательных команд (шагов) внутри данного задания
    steps:
      # ====================================================================================
      # ЧТО ТАКОЕ "uses: actions/checkout@v4":
      # Это готовый официальный плагин (экшен) от GitHub. 
      # Когда пайплайн запускается, GitHub выделяет абсолютно голый и ПУСТОЙ сервер на Linux. 
      # На нем изначально нет файлов вашего проекта. Этот плагин работает как "грузовик": 
      # он автоматически идет в ваш репозиторий, скачивает оттуда все ваши папки (frontend, 
      # backend, database) и распаковывает их на этом временном сервере, чтобы с ними 
      # можно было работать на следующих шагах. Без него сервер просто не увидел бы ваш код.
      # ====================================================================================
      - name: 1. Скачивание кода
        uses: actions/checkout@v4

      # ====================================================================================
      # ЧТО ТАКОЕ "uses: actions/setup-node@v4":
      # Это еще один готовый плагин-помощник от разработчиков GitHub.
      # На чистом сервере Ubuntu изначально не установлен язык Node.js. Без него сервер не поймет 
      # команду "npm install". Этот плагин работает как "доставка инструментов": он быстро 
      # скачивает и разворачивает на сервере нужную версию Node.js (в данном случае 20-ю). 
      # Без него нам пришлось бы писать вручную около 5 длинных системных команд для установки Node.js.
      # ====================================================================================
      - name: 2. Установка Node.js
        uses: actions/setup-node@v4
        with:
          # Указываем серверу GitHub установить именно 20-ю версию Node.js
          node-version: 20

      # run: выполняет стандартные консольные команды в терминале сервера GitHub
      - name: 3. Установка npm-зависимостей бэкенда
        run: |
          # Переходим в папку с кодом бэкенда
          cd backend
          # Устанавливаем все библиотеки (express, pg, cors) из package.json
          npm install

      # Шаг-заглушка для проверки синтаксиса и имитации тестов бэкенда
      - name: 4. Проверка синтаксиса
        run: |
          # Переходим в папку бэкенда
          cd backend
          # Просто выводим сообщение в логи терминала, подтверждающее успех
          echo "Код бэкенда успешно прошёл проверку!"


  # --- СТАДИЯ 2 (ВЫПОЛНЯЕТСЯ ПАРАЛЛЕЛЬНО): ПРОВЕРКА КОДА ФРОНТЕНДА ---
  validate-frontend:
    # Красивое имя задания для интерфейса GitHub
    name: 🎨 Проверка Фронтенда
    # Выделяем для проверки фронтенда еще один чистый сервер Ubuntu в облаке
    runs-on: ubuntu-latest
    
    steps:
      # Снова вызываем плагин-грузовик, чтобы скачать файлы проекта на этот второй сервер
      - name: 1. Скачивание кода
        uses: actions/checkout@v4

      # Запускаем линтер (проверяльщик) для HTML-кода
      - name: 2. Линтинг HTML (Проверка структуры)
        run: |
          # Переходим в папку с фронтендом
          cd frontend
          # npx htmlhint "на лету" сканирует index.html на незакрытые теги и ошибки верстки
          npx htmlhint index.html

      # Базовая проверка доступности главного скрипта фронтенда
      - name: 3. Проверка JavaScript-логики
        run: |
          # Переходим в папку фронтенда
          cd frontend
          # На языке bash-скриптов проверяем: если файл script.js существует и он НЕ пустой (-s)
          if [ -s script.js ]; then
            # То пишем в логи, что всё отлично
            echo "Файл script.js успешно прошел проверку доступности!"
          else
            # Иначе пишем ошибку и принудительно останавливаем пайплайн командой exit 1
            echo "Ошибка: script.js пуст или отсутствует!" && exit 1
          fi


  # --- СТАДИЯ 3: ИНТЕГРАЦИОННЫЙ ТЕСТ (DOCKER COMPOSE) ---
  integration-test:
    # Имя стадии, где будет происходить сборка всей нашей инфраструктуры
    name: 🐳 Сборка и запуск через Docker Compose
    # Снова просим у GitHub чистый сервер Ubuntu
    runs-on: ubuntu-latest
    # NEEDS — ГЛАВНАЯ ДЕВОПС ФИШКА. Сборка не начнется, пока обе стадии выше не станут зелеными!
    needs: [validate-backend, validate-frontend]

    steps:
      # Скачиваем файлы проекта (включая docker-compose.yml) на этот третий сервер
      - name: 1. Скачивание кода из репозитория
        uses: actions/checkout@v4

      # Запускаем Docker Compose. Так как локального .env на сервере нет, мы пишем его здесь
      - name: 2. Запуск всей инфраструктуры с фейковым окружением
        # Блок env временно создает переменные окружения прямо внутри сервера GitHub Actions
        env:
          # Прописываем порты для контейнеров (точно такие же, как у вас на MacBook)
          FRONT_PORT: 8080
          BACKEND_PORT: 5001
          DB_PORT: 5432
          # Задаем абсолютно любые фейковые ("мусорные") доступы к нашей тестовой базе данных
          DB_USER: dummy_test_user
          DB_PASSWORD: dummy_test_password_123
          DB_NAME: dummy_employees_db
        # Сама команда сборки и запуска контейнеров
        run: |
          # Поднимаем всю систему в фоновом режиме (-d) с принудительной пересборкой (--build)
          docker compose up --build -d

      # Контейнерам нужно время, чтобы включиться внутри виртуальной машины GitHub
      - name: 3. Ожидание инициализации системы
        run: |
          # Выводим подсказку в лог
          echo "Ожидаем 10 секунд, пока контейнеры поднимутся..."
          # Команда sleep заставляет сервер сделать паузу в 10 секунд
          sleep 10

      # Выводим диагностическую информацию, чтобы убедиться, что контейнеры работают
      - name: 4. Проверка статуса контейнеров
        run: |
          # docker ps -a покажет список всех контейнеров на сервере и их статусы (Up или Exited)
          docker ps -a

      # Имитируем реальный запрос пользователя к нашему запущенному API бэкенда
      - name: 5. Проверка связи (Curl API Test)
        run: |
          # curl -f делает HTTP-запрос. Если бэкенд вернет ошибку (например 500), curl упадет с exit code 1
          curl -f http://localhost:5001/api/users || exit 1
          # Если curl прошел успешно, выводим радостное сообщение
          echo "Успех! Бэкенд запущен в облаке и успешно отдал тестовые данные!"

      # Правило хорошего тона: удаляем контейнены, чтобы не засорять память облака GitHub
      - name: 6. Остановка контейнеров
        # if: always() гарантирует, что этот шаг выполнится ВСЕГДА (даже если предыдущий тест упал)
        if: always()
        # Повторно передаем те же переменные окружения, иначе docker compose down выдаст ошибку пустого порта
        env:
          FRONT_PORT: 8080
          BACKEND_PORT: 5001
          DB_PORT: 5432
          DB_USER: dummy_test_user
          DB_PASSWORD: dummy_test_password_123
          DB_NAME: dummy_employees_db
        run: |
          # Останавливаем систему и полностью стираем созданные тестовые базы данных (-v)
          docker compose down -v

  # --- ЭТАП 4: ДЕПЛОЙ НА ВАШ MACBOOK С КНОПКОЙ ---
  deploy-to-macbook:
    name: 🚀 Релиз на локальный MacBook
    # 💥 МАГИЯ ДЕВОПСА: вместо ubuntu-latest мы пишем self-hosted!
    # Это заставит GitHub выполнять команды прямо на вашем включенном Mac
    runs-on: self-hosted
    # ИСПРАВЛЕНО: Теперь стадия четко знает, что нужно дождаться успешных тестов Docker Compose
    needs: integration-test
    environment: production # Включает ручную кнопку одобрения релиза

    steps:
      # Этот шаг выполнится прямо в терминале вашего MacBook Air через локальный раннер
      - name: Обновление кода и перезапуск Docker Compose
        run: |
          echo "Пайплайн пришел на ваш MacBook!"
    
          # Так как раннер работает прямо у вас в системе, переходим в папку проекта
          cd /Users/vladislav/Desktop/DevOpsFirstMiniProject
          
          echo "Забираем свежий код из гитхаба..."
          git pull origin main
          
          echo "Перезапускаем контейнеры продакшена..."
          docker compose down
          docker compose up -d --build
          
          echo "Поздравляю! Локальный продакшен успешно обновлен!"
