name: GitHub Actions CI with Dummy Environment

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # --- СТАДИЯ 1: ПРОВЕРКА КОДА БЭКЕНДА ---
  validate-backend:
    name: Проверка кода Бэкенда
    runs-on: ubuntu-latest
    steps:
      - name: 1. Скачивание кода из репозитория
        uses: actions/checkout@v4

      - name: 2. Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Установка npm-зависимостей бэкенда
        run: |
          cd backend
          npm install

      - name: 4. Проверка синтаксиса
        run: |
          cd backend
          echo "Код бэкенда успешно прошёл базовую проверку!"

  # --- СТАДИЯ 2: ИНТЕГРАЦИОННЫЙ ТЕСТ (DOCKER COMPOSE) ---
  integration-test:
    name: Сборка и запуск через Docker Compose
    runs-on: ubuntu-latest
    needs: validate-backend

    steps:
      - name: 1. Скачивание кода из репозитория
        uses: actions/checkout@v4

      # Передаем "мусорные" переменные. Docker Compose на сервере GitHub подставит 
      # их вместо вашего локального .env, поднимет контейнеры и свяжет их.
      # Пароли типа "dummy" абсолютно безопасны для публикации в репозитории.
      - name: 2. Запуск всей инфраструктуры с фейковым окружением
        env:
          FRONT_PORT: 8080
          BACKEND_PORT: 5001
          DB_PORT: 5432
          DB_USER: dummy_test_user
          DB_PASSWORD: dummy_test_password_123
          DB_NAME: dummy_employees_db
        run: |
          docker compose up --build -d

      # Ждем 10 секунд, пока запустится Postgres и отработает ваш healthcheck
      - name: 3. Ожидание инициализации системы
        run: |
          echo "Ожидаем 10 секунд, пока контейнеры поднимутся..."
          sleep 10

      - name: 4. Проверка статуса контейнеров
        run: |
          docker ps -a

      # Curl имитирует запрос пользователя к бэкенду на порт 5001
      - name: 5. Проверка связи (Curl API Test)
        run: |
          curl -f http://localhost:5001/api/users || exit 1
          echo "Успех! Бэкенд запущен в облаке и успешно отдал тестовые данные!"

      # Чистим за собой серверные ресурсы GitHub
      - name: 6. Остановка контейнеров
        if: always()
        env:
          FRONT_PORT: 8080
          BACKEND_PORT: 5001
          DB_PORT: 5432
          DB_USER: dummy_test_user
          DB_PASSWORD: dummy_test_password_123
          DB_NAME: dummy_employees_db
        run: |
          docker compose down -v
          echo "Успех в облаке и успешно отдал тестовые данные!"
